[package]
name = "keyrill-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "KeyrillRegister"
path = "src/bin/keyrill-register.rs"

[features]
test-api = []

[dependencies]
keyrill-ffi = { path = "../../../crates/keyrill-ffi", version = "=0.1.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[build-dependencies]
cc = "=1.2.56"

[lints]
workspace = true
