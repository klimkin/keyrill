[package]
name = "keyrill-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "KeyrillRegister"
path = "src/bin/keyrill-register.rs"

[features]
test-api = []

[dependencies]
keyrill-ffi = { path = "../../../crates/keyrill-ffi", version = "=0.1.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Environment", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[build-dependencies]
keyrill-windows-build = { path = "../build-support" }

[lints]
workspace = true
